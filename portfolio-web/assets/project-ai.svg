<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080305" />
      <stop offset="50%" stop-color="#140609" />
      <stop offset="100%" stop-color="#26080e" />
    </linearGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#cyberBg)" />
  
  <!-- Grid Matrix -->
  <g stroke="rgba(239, 68, 68, 0.12)" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="500"/>
    <line x1="300" y1="0" x2="300" y2="500"/>
    <line x1="450" y1="0" x2="450" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
  </g>

  <!-- Glowing Red AI Core / Hologram -->
  <circle cx="400" cy="230" r="140" fill="#dc2626" opacity="0.22" filter="url(#neonGlow)" />
  <circle cx="400" cy="230" r="100" fill="none" stroke="url(#neonGradient)" stroke-width="3" stroke-dasharray="12 8" />
  <circle cx="400" cy="230" r="70" fill="none" stroke="#f87171" stroke-width="2" opacity="0.85" />
  <circle cx="400" cy="230" r="40" fill="url(#neonGradient)" opacity="0.75" filter="url(#neonGlow)" />

  <!-- Orbiting Nodes -->
  <circle cx="300" cy="230" r="8" fill="#f87171" filter="url(#neonGlow)"/>
  <circle cx="500" cy="230" r="8" fill="#ef4444" filter="url(#neonGlow)"/>
  <circle cx="400" cy="130" r="8" fill="#dc2626" filter="url(#neonGlow)"/>
  <circle cx="400" cy="330" r="8" fill="#b91c1c" filter="url(#neonGlow)"/>

  <!-- Waveform Red Lines -->
  <path d="M 120 400 Q 200 350 280 400 T 440 400 T 600 370 T 700 400" fill="none" stroke="url(#neonGradient)" stroke-width="3" filter="url(#neonGlow)" />
  <path d="M 100 420 Q 220 440 340 390 T 520 430 T 720 410" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.5" />

  <!-- Badges -->
  <g transform="translate(40, 40)">
    <rect width="180" height="34" rx="17" fill="rgba(10, 4, 6, 0.85)" stroke="#ef4444" stroke-width="1.2" />
    <text x="90" y="22" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">GENERATIVE AI 2.0</text>
  </g>
  <g transform="translate(620, 40)">
    <rect width="140" height="34" rx="17" fill="rgba(10, 4, 6, 0.85)" stroke="#dc2626" stroke-width="1.2" />
    <text x="70" y="22" fill="#ef4444" font-family="system-ui, sans-serif" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="1">4K RESOLUTION</text>
  </g>
</svg>