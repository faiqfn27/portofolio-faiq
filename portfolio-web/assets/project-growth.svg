<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="growthBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080305" />
      <stop offset="50%" stop-color="#140609" />
      <stop offset="100%" stop-color="#22060c" />
    </linearGradient>
    <linearGradient id="redBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7f1d1d" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <linearGradient id="crimsonBar" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#growthBg)" />

  <!-- Circles / Floating elements -->
  <circle cx="680" cy="120" r="140" fill="#dc2626" opacity="0.18" filter="url(#glowFilt)" />
  <circle cx="150" cy="380" r="120" fill="#ef4444" opacity="0.2" filter="url(#glowFilt)" />

  <!-- Social Media & Analytics Cards -->
  <g transform="translate(100, 70)">
    <!-- Main Card -->
    <rect width="600" height="360" rx="16" fill="rgba(16, 6, 9, 0.9)" stroke="rgba(239, 68, 68, 0.25)" stroke-width="1.5" />

    <!-- Header bar -->
    <text x="30" y="45" fill="#fef2f2" font-family="system-ui, sans-serif" font-size="18" font-weight="700">Content Performance &amp; Viral Reach</text>
    <text x="30" y="70" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="12">TikTok &amp; Instagram Multi-Platform Analytics</text>

    <!-- Key Metrics row -->
    <g transform="translate(30, 95)">
      <rect width="160" height="70" rx="10" fill="#20080d" stroke="#5c101b" stroke-width="1" />
      <text x="15" y="26" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="11" font-weight="600">TOTAL REACH</text>
      <text x="15" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">1.2M+</text>

      <rect x="180" y="0" width="160" height="70" rx="10" fill="#2b0a11" stroke="#751523" stroke-width="1" />
      <text x="195" y="26" fill="#fecaca" font-family="system-ui, sans-serif" font-size="11" font-weight="600">ENGAGEMENT RATE</text>
      <text x="195" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">14.8%</text>

      <rect x="360" y="0" width="180" height="70" rx="10" fill="#3b0c16" stroke="#991b1b" stroke-width="1" />
      <text x="375" y="26" fill="#f87171" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CONVERSION LIFT</text>
      <text x="375" y="54" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="800">+340%</text>
    </g>

    <!-- Barchart -->
    <g transform="translate(30, 200)">
      <!-- Bars -->
      <rect x="20" y="70" width="28" height="60" rx="6" fill="url(#redBar)" opacity="0.6"/>
      <rect x="70" y="50" width="28" height="80" rx="6" fill="url(#redBar)" opacity="0.75"/>
      <rect x="120" y="30" width="28" height="100" rx="6" fill="url(#redBar)" opacity="0.85"/>
      <rect x="170" y="15" width="28" height="115" rx="6" fill="url(#crimsonBar)"/>
      <rect x="220" y="45" width="28" height="85" rx="6" fill="url(#redBar)" opacity="0.8"/>
      <rect x="270" y="20" width="28" height="110" rx="6" fill="url(#crimsonBar)"/>
      <rect x="320" y="0" width="28" height="130" rx="6" fill="url(#crimsonBar)" filter="url(#glowFilt)"/>

      <!-- Spline curve overlay -->
      <path d="M 34 80 Q 84 60 134 40 T 234 50 T 334 10" fill="none" stroke="#ef4444" stroke-width="3" filter="url(#glowFilt)"/>
      <circle cx="334" cy="10" r="6" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>

      <!-- Viral Tag Card -->
      <g transform="translate(380, 20)">
        <rect width="160" height="90" rx="10" fill="#0d0406" stroke="#450a0a" />
        <circle cx="25" cy="25" r="10" fill="#ef4444" />
        <text x="45" y="29" fill="#fef2f2" font-family="system-ui, sans-serif" font-size="12" font-weight="700">AI Viral Trend</text>
        <text x="15" y="56" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">High retention rate &amp;</text>
        <text x="15" y="72" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10">organic reach spikes.</text>
      </g>
    </g>
  </g>
</svg>