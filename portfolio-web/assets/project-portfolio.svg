<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="portBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="aiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#portBg)" />

  <!-- Browser Frame -->
  <g transform="translate(40, 30)">
    <rect width="720" height="440" rx="16" fill="#0f172a" stroke="#312e81" stroke-width="2" />
    
    <!-- Top Bar -->
    <rect width="720" height="42" rx="16" fill="#1e1b4b" />
    <circle cx="25" cy="21" r="6" fill="#ef4444" />
    <circle cx="45" cy="21" r="6" fill="#f59e0b" />
    <circle cx="65" cy="21" r="6" fill="#10b981" />
    
    <rect x="110" y="10" width="460" height="22" rx="6" fill="#0f172a" stroke="#4338ca" />
    <text x="340" y="25" fill="#a5b4fc" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">faiq.portfolio/ai-assistant-live</text>

    <!-- Floating Pill Navbar in Preview -->
    <g transform="translate(180, 56)">
      <rect width="360" height="34" rx="17" fill="#1e293b" stroke="#475569" />
      <rect x="8" y="5" width="24" height="24" rx="6" fill="#38bdf8" />
      <text x="20" y="21" fill="#090d16" font-family="sans-serif" font-size="10" font-weight="800" text-anchor="middle">FF</text>
      <text x="40" y="22" fill="#f8fafc" font-family="sans-serif" font-size="10" font-weight="700">PORTFOLIO.</text>
      <text x="135" y="22" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">Home</text>
      <text x="180" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">About</text>
      <text x="230" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Experience</text>
      <text x="300" y="22" fill="#94a3b8" font-family="sans-serif" font-size="10">Projects</text>
    </g>

    <!-- Hero Left -->
    <g transform="translate(40, 115)">
      <text x="0" y="30" fill="#f8fafc" font-family="'Plus Jakarta Sans', sans-serif" font-size="28" font-weight="800">Hi, I'm Faiq Fanani</text>
      <text x="0" y="55" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="700">Mahasiswa Sistem Informasi</text>
      <text x="0" y="75" fill="#818cf8" font-family="sans-serif" font-size="12">Universitas Sunan Gresik • Web Developer</text>
      
      <rect x="0" y="95" width="120" height="32" rx="16" fill="#38bdf8" />
      <text x="60" y="115" fill="#090d16" font-family="sans-serif" font-size="11" font-weight="700" text-anchor="middle">Explore Work →</text>
      
      <!-- Tech badges -->
      <g transform="translate(0, 150)">
        <rect width="60" height="22" rx="4" fill="#1e293b" />
        <text x="30" y="15" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">HTML/CSS</text>
        
        <rect x="68" width="55" height="22" rx="4" fill="#1e293b" />
        <text x="95" y="15" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">JS (ES6)</text>

        <rect x="130" width="50" height="22" rx="4" fill="#1e293b" />
        <text x="155" y="15" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">PHP</text>
        
        <rect x="188" width="55" height="22" rx="4" fill="#1e293b" />
        <text x="215" y="15" fill="#94a3b8" font-family="sans-serif" font-size="9" text-anchor="middle">MySQL</text>
      </g>
    </g>

    <!-- Live AI Chat Widget Card on Right -->
    <g transform="translate(380, 105)">
      <!-- Chat Container -->
      <rect width="300" height="315" rx="16" fill="#1e293b" stroke="#4338ca" stroke-width="1.5" />
      
      <!-- Chat Header -->
      <rect width="300" height="42" rx="16" fill="#312e81" />
      <circle cx="22" cy="21" r="10" fill="url(#aiGrad)" />
      <text x="22" y="25" fill="#ffffff" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">AI</text>
      <text x="40" y="20" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="700">Faiq Assistant</text>
      <text x="40" y="32" fill="#10b981" font-family="sans-serif" font-size="9" font-weight="600">● Online</text>

      <!-- Message 1: Bot -->
      <g transform="translate(15, 55)">
        <rect width="210" height="44" rx="10" fill="#0f172a" stroke="#334155" />
        <text x="12" y="18" fill="#f8fafc" font-family="sans-serif" font-size="10">Halo! Saya asisten AI Faiq Fanani.</text>
        <text x="12" y="32" fill="#94a3b8" font-family="sans-serif" font-size="9">Ada yang ingin ditanyakan?</text>
      </g>

      <!-- Message 2: User -->
      <g transform="translate(85, 110)">
        <rect width="200" height="44" rx="10" fill="#38bdf8" />
        <text x="12" y="18" fill="#090d16" font-family="sans-serif" font-size="10" font-weight="700">Faiq kuliah di mana?</text>
        <text x="12" y="32" fill="#0f172a" font-family="sans-serif" font-size="9">dan jurusannya apa?</text>
      </g>

      <!-- Message 3: Bot Answer -->
      <g transform="translate(15, 165)">
        <rect width="235" height="52" rx="10" fill="#0f172a" stroke="#334155" />
        <text x="12" y="18" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="700">Universitas Sunan Gresik</text>
        <text x="12" y="32" fill="#f8fafc" font-family="sans-serif" font-size="9">Program Studi Sistem Informasi (S1)</text>
        <text x="12" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9">Fokus Web &amp; Database Design.</text>
      </g>

      <!-- Typing / Input Bar -->
      <rect x="15" y="270" width="270" height="32" rx="16" fill="#0f172a" stroke="#475569" />
      <text x="30" y="290" fill="#64748b" font-family="sans-serif" font-size="10">Tanyakan sesuatu ke AI...</text>
      <circle cx="265" cy="286" r="10" fill="#38bdf8" />
      <text x="265" y="290" fill="#090d16" font-family="sans-serif" font-size="10" text-anchor="middle">➤</text>
    </g>
  </g>
</svg>
