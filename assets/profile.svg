<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070305" />
      <stop offset="50%" stop-color="#140609" />
      <stop offset="100%" stop-color="#26080e" />
    </linearGradient>
    <linearGradient id="neonRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="50%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <linearGradient id="deepCrimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <radialGradient id="glowBack" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.65"/>
      <stop offset="55%" stop-color="#991b1b" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#070305" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)" />
  <circle cx="200" cy="240" r="180" fill="#dc2626" opacity="0.3" filter="url(#softGlow)" />
  <circle cx="430" cy="310" r="190" fill="#991b1b" opacity="0.45" filter="url(#softGlow)" />
  <circle cx="300" cy="210" r="220" fill="url(#glowBack)" />

  <!-- Stylized Silhouette with Moody Red Studio Lighting -->
  <g transform="translate(0, 30)">
    <!-- Back light rim left (Crimson) -->
    <path d="M 230 180 Q 200 240 210 320 Q 220 370 170 450 L 120 650 L 260 650 L 260 520 Q 260 380 230 180 Z" fill="url(#neonRed)" opacity="0.35" filter="url(#softGlow)"/>
    <!-- Back light rim right (Deep Ruby) -->
    <path d="M 370 180 Q 400 240 390 320 Q 380 370 430 450 L 480 650 L 340 650 L 340 520 Q 340 380 370 180 Z" fill="url(#deepCrimson)" opacity="0.4" filter="url(#softGlow)"/>

    <!-- T-Shirt Body (Black with Crimson Rim Light) -->
    <path d="M 160 480 Q 240 430 300 440 Q 360 430 440 480 L 490 670 L 110 670 Z" fill="#18181b" />
    <!-- Shadows & Creases on shirt -->
    <path d="M 160 480 Q 220 540 270 570 L 270 670 L 110 670 Z" fill="#09090b" opacity="0.8"/>
    <path d="M 440 480 Q 380 550 330 580 L 330 670 L 490 670 Z" fill="#27272a" opacity="0.5"/>
    <path d="M 260 450 Q 300 480 340 450 Q 300 460 260 450 Z" fill="#3f3f46" opacity="0.6"/>

    <!-- Red Rim Lighting on Shoulders -->
    <path d="M 160 480 L 170 540 L 185 530 L 175 480 Z" fill="#ef4444" opacity="0.5" filter="url(#softGlow)" />
    <path d="M 440 480 L 430 540 L 415 530 L 425 480 Z" fill="#dc2626" opacity="0.5" filter="url(#softGlow)" />

    <!-- Neck -->
    <path d="M 265 370 L 265 460 Q 300 475 335 460 L 335 370 Z" fill="#d97706" opacity="0.85"/>
    <path d="M 265 370 L 265 460 Q 290 470 300 470 L 300 370 Z" fill="#dc2626" opacity="0.45"/>
    <path d="M 335 370 L 335 460 Q 310 470 300 470 L 300 370 Z" fill="#7f1d1d" opacity="0.5"/>

    <!-- Head / Face base -->
    <ellipse cx="300" cy="300" rx="65" ry="85" fill="#f59e0b" opacity="0.9" />
    <!-- Face lighting left (Crimson) -->
    <path d="M 300 215 Q 235 240 235 300 Q 235 365 300 385 Z" fill="#ef4444" opacity="0.5" />
    <!-- Face lighting right (Dark Red) -->
    <path d="M 300 215 Q 365 240 365 300 Q 365 365 300 385 Z" fill="#991b1b" opacity="0.5" />

    <!-- Hair -->
    <path d="M 230 290 Q 220 220 260 180 Q 300 160 345 180 Q 375 210 370 280 Q 355 240 325 230 Q 275 230 230 290 Z" fill="#09090b" />
    <path d="M 240 250 Q 285 215 355 230 Q 320 195 270 205 Z" fill="#18181b" />

    <!-- Facial details stylized -->
    <ellipse cx="275" cy="295" rx="7" ry="4" fill="#09090b" opacity="0.9" />
    <ellipse cx="325" cy="295" rx="7" ry="4" fill="#09090b" opacity="0.9" />
    <path d="M 298 295 L 295 325 Q 300 330 305 325 Z" fill="#991b1b" opacity="0.7"/>
    <path d="M 285 345 Q 300 355 315 345" stroke="#7f1d1d" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.85"/>
  </g>

  <!-- Glowing Tech Badge Overlay -->
  <g transform="translate(40, 580)">
    <rect width="230" height="52" rx="26" fill="#090406" fill-opacity="0.9" stroke="url(#neonRed)" stroke-width="1.6" />
    <circle cx="28" cy="26" r="6" fill="#ef4444">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="44" y="24" fill="#fca5a5" font-family="system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1">UNIV. SUNAN GRESIK</text>
    <text x="44" y="39" fill="#ffffff" font-family="system-ui, sans-serif" font-size="13" font-weight="800">Faiq Fanani</text>
  </g>
</svg>