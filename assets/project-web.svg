<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="webBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090406" />
      <stop offset="60%" stop-color="#140609" />
      <stop offset="100%" stop-color="#070305" />
    </linearGradient>
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f87171" />
    </linearGradient>
    <filter id="webGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#webBg)" />

  <!-- Code editor / Academic Portal UI Window -->
  <g transform="translate(80, 50)">
    <!-- Browser window card -->
    <rect width="640" height="380" rx="12" fill="#0d0507" stroke="#381016" stroke-width="1.5" />
    <!-- Window top bar -->
    <rect width="640" height="40" rx="12" fill="#1c0a0e" />
    <circle cx="25" cy="20" r="5" fill="#ef4444" />
    <circle cx="45" cy="20" r="5" fill="#f59e0b" />
    <circle cx="65" cy="20" r="5" fill="#10b981" />
    <!-- URL bar -->
    <rect x="120" y="10" width="400" height="20" rx="6" fill="#0a0305" stroke="#450a0a" stroke-width="1" />
    <text x="320" y="24" fill="#fca5a5" font-family="monospace" font-size="11" text-anchor="middle">https://si.sunan-gresik.ac.id/portal</text>

    <!-- Sidebar -->
    <rect x="0" y="40" width="140" height="340" fill="#14070a" />
    <rect x="15" y="65" width="110" height="24" rx="4" fill="#dc2626" opacity="0.4"/>
    <rect x="15" y="105" width="90" height="12" rx="3" fill="#450a0a" />
    <rect x="15" y="130" width="100" height="12" rx="3" fill="#450a0a" />
    <rect x="15" y="155" width="80" height="12" rx="3" fill="#450a0a" />

    <!-- Content area -->
    <!-- Metric cards -->
    <rect x="160" y="60" width="140" height="65" rx="8" fill="#1c0a0e" stroke="#450a0a" />
    <circle cx="185" cy="85" r="12" fill="#ef4444" opacity="0.25"/>
    <rect x="210" y="75" width="70" height="8" rx="2" fill="#fca5a5"/>
    <rect x="210" y="90" width="50" height="12" rx="3" fill="#ef4444"/>

    <rect x="315" y="60" width="140" height="65" rx="8" fill="#1c0a0e" stroke="#450a0a" />
    <circle cx="340" cy="85" r="12" fill="#dc2626" opacity="0.25"/>
    <rect x="365" y="75" width="60" height="8" rx="2" fill="#fca5a5"/>
    <rect x="365" y="90" width="40" height="12" rx="3" fill="#f87171"/>

    <rect x="470" y="60" width="150" height="65" rx="8" fill="#1c0a0e" stroke="#450a0a" />
    <circle cx="495" cy="85" r="12" fill="#b91c1c" opacity="0.25"/>
    <rect x="520" y="75" width="75" height="8" rx="2" fill="#fca5a5"/>
    <rect x="520" y="90" width="60" height="12" rx="3" fill="#fca5a5"/>

    <!-- Chart area -->
    <rect x="160" y="145" width="460" height="150" rx="8" fill="#17080b" stroke="#3b0f15" />
    <!-- Polyline chart -->
    <polyline points="180,260 230,220 280,240 340,190 400,210 460,170 520,200 580,165" fill="none" stroke="url(#codeGrad)" stroke-width="3" filter="url(#webGlow)"/>
    <circle cx="460" cy="170" r="5" fill="#f87171"/>
    <circle cx="580" cy="165" r="5" fill="#ef4444"/>

    <!-- Table preview rows -->
    <rect x="160" y="315" width="460" height="16" rx="4" fill="#2d0c12" opacity="0.6"/>
    <rect x="160" y="340" width="380" height="16" rx="4" fill="#2d0c12" opacity="0.4"/>
  </g>
</svg>